<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchLy — TV Shows</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        #main-navbar, .navbar { background-color: #0a1628; padding: 10px 32px; border-bottom: 1px solid #1e3050; display: flex; align-items: center; gap: 24px; position: sticky; top: 0; z-index: 1000; }
        #main-navbar .navbar-brand { color: #F63049; font-weight: 700; font-size: 22px; white-space: nowrap; flex-shrink: 0; margin: 0; text-decoration: none; }
        .nav-search { flex: 1; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
        .nav-search-input { flex: 1; background-color: #1a2d47; border: 1px solid #1e3050; border-radius: 8px; padding: 8px 14px; color: #ffffff; font-size: 13px; outline: none; }
        .nav-search-input::placeholder { color: #555; }
        .nav-search-input:focus { border-color: #F63049; }
        .nav-search-btn { background-color: #F63049; color: #ffffff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .nav-search-btn:hover { background-color: #d42a3f; }
        #nav-links { flex-shrink: 0; display: flex; align-items: center; gap: 4px; }
        #main-navbar .nav-link { color: #aaaaaa; font-size: 14px; padding: 6px 12px; text-decoration: none; white-space: nowrap; }
        #main-navbar .nav-link:hover { color: #ffffff; }
        #main-navbar .active-link { color: #ffffff; font-weight: 600; }
        .nav-avatar { width: 34px; height: 34px; border-radius: 50%; background-color: #F63049; color: #ffffff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-left: 8px; text-decoration: none; flex-shrink: 0; cursor: pointer; }
        .page-header { padding: 40px 60px 20px; background: linear-gradient(to bottom, rgba(10,22,40,0.9), transparent); }
        .page-header h2 { color: #fff; font-size: 32px; font-weight: 700; margin: 0 0 8px; }
        .page-header p { color: #aaa; font-size: 16px; margin: 0; }
        .genre-section { margin-bottom: 48px; padding: 0 60px; }
        .genre-title { color: #fff; font-size: 20px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .genre-title i { color: #F63049; }
        .movie-card { cursor: pointer; transition: transform 0.3s; }
        .movie-card:hover { transform: translateY(-5px); }
        .movie-poster-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
        .movie-title { color: #fff; font-size: 14px; font-weight: 600; margin: 0 0 4px; }
        .movie-year { color: #aaa; font-size: 12px; margin: 0; }
        @media(max-width:768px){ #main-navbar{padding:10px 16px; flex-wrap:wrap;} .nav-search{width:100%; order:3; margin-top:10px;} .page-header{padding:30px 16px 15px;} .genre-section{padding:0 16px;} }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg" id="main-navbar">
        <a class="navbar-brand" href="home.html">WatchLy</a>
        <div class="nav-search">
            <input type="text" class="nav-search-input" id="nav-search-input" placeholder="Search movies, TV shows...">
            <button class="nav-search-btn" onclick="goToSearch()">Search</button>
        </div>
        <div class="d-flex align-items-center ml-auto" id="nav-links">
            <a href="home.html" class="nav-link">Home</a>
            <a href="search.html" class="nav-link">Search</a>
            <a href="movies.html" class="nav-link">Movies</a>
            <a href="tvshows.html" class="nav-link active-link">TV Shows</a>
            <a href="profile.html" class="nav-avatar" id="userAvatar">A</a>
        </div>
    </nav>

    <div class="page-header"><h2>Browse TV Shows</h2><p>Explore our collection organized by genre</p></div>

    <div class="container-fluid px-4">
        <section class="genre-section">
            <h3 class="genre-title"><i class="fas fa-theater-masks"></i> Drama</h3>
            <div class="row" id="dramaShows"></div>
        </section>
        <section class="genre-section">
            <h3 class="genre-title"><i class="fas fa-laugh"></i> Comedy</h3>
            <div class="row" id="comedyShows"></div>
        </section>
        <section class="genre-section">
            <h3 class="genre-title"><i class="fas fa-rocket"></i> Sci-Fi</h3>
            <div class="row" id="scifiShows"></div>
        </section>
        <section class="genre-section">
            <h3 class="genre-title"><i class="fas fa-bolt"></i> Action & Adventure</h3>
            <div class="row" id="actionShows"></div>
        </section>
    </div>

    <script>
        const shows = {
            dramaShows: [
                { id: 1396, title: "Breaking Bad", year: "2008-2013", poster: "https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg" },
                { id: 1399, title: "The Crown", year: "2016-2023", poster: "https://image.tmdb.org/t/p/w500/1M876KPjulVwppEpldhdc8V4o68.jpg" },
                { id: 60059, title: "Better Call Saul", year: "2015-2022", poster: "https://image.tmdb.org/t/p/w500/fC2HDm5t0kHl7mTm7jxMR31b7by.jpg" },
                { id: 100088, title: "The Last of Us", year: "2023-", poster: "https://image.tmdb.org/t/p/w500/uKvVjHNqB5VmOrdxqAt2F7J78ED.jpg" }
            ],
            comedyShows: [
                { id: 1668, title: "Friends", year: "1994-2004", poster: "https://image.tmdb.org/t/p/w500/f496cm9enuEsZkSPzCwnGSEKJwv.jpg" },
                { id: 2316, title: "The Office", year: "2005-2013", poster: "https://image.tmdb.org/t/p/w500/7DJKHzAi83BmQrWLrYYOqcoKfhR.jpg" },
                { id: 48891, title: "Brooklyn Nine-Nine", year: "2013-2021", poster: "https://image.tmdb.org/t/p/w500/hgRMSOt7a1b8qyQR68vUixJPang.jpg" },
                { id: 8592, title: "Parks and Recreation", year: "2009-2015", poster: "https://image.tmdb.org/t/p/w500/dDuzrl9rUIBYieZjqmtNCdncrmZ.jpg" }
            ],
            scifiShows: [
                { id: 66732, title: "Stranger Things", year: "2016-", poster: "https://image.tmdb.org/t/p/w500/49WJfeN0moxb9IPfGn8AIqMGskD.jpg" },
                { id: 42009, title: "Black Mirror", year: "2011-", poster: "https://image.tmdb.org/t/p/w500/5UaYsGZOFhjFDwQix4Nz4T4hZl.jpg" },
                { id: 82856, title: "The Mandalorian", year: "2019-", poster: "https://image.tmdb.org/t/p/w500/eU1i6eHXlzMOlEq0ku1Rzq7Y4wA.jpg" },
                { id: 119051, title: "Fallout", year: "2024-", poster: "https://image.tmdb.org/t/p/w500/7I6VUdPj6tQECNHdviJkUHD2u89.jpg" }
            ],
            actionShows: [
                { id: 76479, title: "The Boys", year: "2019-", poster: "https://image.tmdb.org/t/p/w500/stTEycfG9928HYGEISBFaG1ngjM.jpg" },
                { id: 71912, title: "The Witcher", year: "2019-", poster: "https://image.tmdb.org/t/p/w500/7vjaCdMw15FEbXJPZXCIDlizgk.jpg" },
                { id: 126308, title: "Shogun", year: "2024-", poster: "https://image.tmdb.org/t/p/w500/7O4iVfOMQmdCS1hOg1h7jV8rZ3j.jpg" },
                { id: 44217, title: "Vikings", year: "2013-2020", poster: "https://image.tmdb.org/t/p/w500/bQLrHIRNEkE3PdIWQrZHynQZazu.jpg" }
            ]
        };

        function renderGenre(containerId, items) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = items.map(s => `
                <div class="col-lg-3 col-md-4 col-6 mb-4">
                    <a href="content-detail.html?id=${s.id}&type=tv" style="text-decoration:none;color:inherit;">
                        <div class="movie-card">
                            <img src="${s.poster}" class="movie-poster-img" alt="${s.title}" onerror="this.src='https://via.placeholder.com/200x300/1a2d47/F63049?text=${encodeURIComponent(s.title)}'">
                            <p class="movie-title">${s.title}</p>
                            <p class="movie-year">${s.year}</p>
                        </div>
                    </a>
                </div>
            `).join('');
        }

        function goToSearch() {
            const q = document.getElementById('nav-search-input').value.trim();
            if(q) window.location.href = `search.html?q=${encodeURIComponent(q)}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            Object.keys(shows).forEach(k => renderGenre(k, shows[k]));
            const s = localStorage.getItem('watchly_session');
            if(s) document.getElementById('userAvatar').textContent = JSON.parse(s).user.name.charAt(0);
        });
    </script>
</body>
</html>
