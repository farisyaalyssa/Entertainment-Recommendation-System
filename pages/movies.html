<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchLy — Movies</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/browse.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg" id="main-navbar">
        <a class="navbar-brand" href="home.html">WatchLy</a>
        <div class="nav-search">
            <input type="text" class="nav-search-input" id="nav-search-input" placeholder="Search movies, TV shows...">
            <button class="nav-search-btn" onclick="goToSearch()">Search</button>
        </div>
        <div class="d-flex align-items-center ml-auto" id="nav-links">
            <a href="home.html" class="nav-link">Home</a>
            <a href="search.html" class="nav-link">Search</a>
            <a href="movies.html" class="nav-link active-link">Movies</a>
            <a href="tvshows.html" class="nav-link">TV Shows</a>
            <a href="profile.html" class="nav-link">My List</a>
            <a href="profile.html" class="nav-avatar" id="userAvatar">A</a>
        </div>
    </nav>

    <div class="page-header">
        <h2>Browse Movies</h2>
        <p>Explore our collection organized by genre</p>
    </div>

    <div class="container-fluid px-4">
        <section class="genre-section">
            <h3 class="genre-title">Action</h3>
            <div class="row" id="actionMovies"></div>
        </section>
        <section class="genre-section">
            <h3 class="genre-title">Drama</h3>
            <div class="row" id="dramaMovies"></div>
        </section>
        <section class="genre-section">
            <h3 class="genre-title">Sci-Fi</h3>
            <div class="row" id="scifiMovies"></div>
        </section>
        <section class="genre-section">
            <h3 class="genre-title">Romance</h3>
            <div class="row" id="romanceMovies"></div>
        </section>
    </div>

    <script src="../js/api.js"></script>
    <script>
        var TMDB_API_KEY = '434da963b3d04ec74b1a61e704853ac7';
        var TMDB_BASE_URL = 'https://api.themoviedb.org/3';
        var TMDB_IMAGE_URL = 'https://image.tmdb.org/t/p/w500';

        var MOVIE_GENRE_MAP = {
            'actionMovies': 28,
            'dramaMovies': 18,
            'scifiMovies': 878,
            'romanceMovies': 10749
        };

        function fetchMoviesByGenre(genreId) {
            var url = TMDB_BASE_URL + '/discover/movie?api_key=' + TMDB_API_KEY + 
                      '&with_genres=' + genreId + '&sort_by=popularity.desc';
            return fetch(url)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    return data.results.slice(0, 12).map(function(movie) {
                        return {
                            id: movie.id,
                            title: movie.title,
                            year: movie.release_date ? movie.release_date.substring(0, 4) : 'N/A',
                            poster: movie.poster_path ? TMDB_IMAGE_URL + movie.poster_path : ''
                        };
                    });
                })
                .catch(function(err) {
                    console.error('Error fetching movies:', err);
                    return [];
                });
        }

        function renderGenre(containerId, items) {
            var container = document.getElementById(containerId);
            if (!container) return;
            
            container.innerHTML = items.map(function(m) {
                return '<div class="col-lg-3 col-md-4 col-6 mb-4">' +
                    '<a href="content-detail.html?id=' + m.id + '&type=movie" style="text-decoration:none;color:inherit;">' +
                        '<div class="movie-card">' +
                            '<img src="' + m.poster + '" class="movie-poster-img" alt="' + m.title + '" onerror="this.onerror=null; this.src=\'https://via.placeholder.com/200x300/1a2d47/F63049?text=' + encodeURIComponent(m.title) + '\';">' +
                            '<p class="movie-title">' + m.title + '</p>' +
                            '<p class="movie-year">' + m.year + '</p>' +
                        '</div>' +
                    '</a>' +
                '</div>';
            }).join('');
        }

        function goToSearch() {
            var q = document.getElementById('nav-search-input').value.trim();
            if (q) window.location.href = 'search.html?q=' + encodeURIComponent(q);
        }

        async function loadMovies() {
            for (var containerId in MOVIE_GENRE_MAP) {
                var genreId = MOVIE_GENRE_MAP[containerId];
                var movies = await fetchMoviesByGenre(genreId);
                renderGenre(containerId, movies);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateNavAvatar();
            loadMovies();
        });
    </script>
</body>
</html>
