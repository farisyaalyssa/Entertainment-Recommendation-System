<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchLy — Search</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg" id="main-navbar">
        <a class="navbar-brand" href="home.html">WatchLy</a>
        <div class="d-flex align-items-center ml-auto" id="nav-links">
            <a href="home.html" class="nav-link">Home</a>
            <a href="search.html" class="nav-link active-link">Search</a>
            <a href="movies.html" class="nav-link">Movies</a>
            <a href="tvshows.html" class="nav-link">TV Shows</a>
            <a href="profile.html" class="nav-link">My List</a>
            <a href="profile.html" class="nav-avatar">A</a>
        </div>
    </nav>

    <!-- SEARCH HERO -->
    <div class="search-hero">
        <h2 class="search-hero-title">Find your next watch</h2>
        <p class="search-hero-sub">Search across movies and TV shows</p>
        <div class="search-bar-wrap">
            <input type="text" id="searchInput" placeholder="Search movies or TV shows..." onkeydown="if(event.key==='Enter') search()">
            <button onclick="search()">Search</button>
        </div>
    </div>

    <!-- FILTERS -->
    <section class="filters">
        <select id="type">
            <option value="">All Types</option>
            <option value="Movie">Movie</option>
            <option value="TV Show">TV Show</option>
        </select>
        <select id="genre">
            <option value="">All Genres</option>
            <option value="Action">Action</option>
            <option value="Romance">Romance</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Thriller">Thriller</option>
        </select>
        <select id="rating">
            <option value="">Any Rating</option>
            <option value="9">9+</option>
            <option value="8">8+</option>
            <option value="7">7+</option>
        </select>
    
        <button class="btn-clear" onclick="clearFilters()">Clear</button>
    </section>

    <!-- RESULTS COUNT -->
    <div id="results-meta" class="results-meta"></div>

    <!-- RESULTS -->
    <section id="results"></section>

    <script src="../js/search.js"></script>
    <script>
        function goToSearch() {
            var query = document.getElementById('nav-search-input') && document.getElementById('nav-search-input').value.trim();
            if (query) {
                window.location.href = 'search.html?q=' + encodeURIComponent(query);
            }
        }
    </script>

</body>
</html>
