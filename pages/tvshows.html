<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchLy — TV Shows</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/browse.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg" id="main-navbar">
        <a class="navbar-brand" href="home.html">WatchLy</a>
        <div class="nav-search">
            <input type="text" class="nav-search-input" id="nav-search-input" placeholder="Search movies, TV shows...">
            <button class="nav-search-btn" onclick="goToSearch()">Search</button>
        </div>
        <div class="d-flex align-items-center ml-auto" id="nav-links">
            <a href="home.html" class="nav-link">Home</a>
            <a href="search.html" class="nav-link">Search</a>
            <a href="movies.html" class="nav-link">Movies</a>
            <a href="tvshows.html" class="nav-link active-link">TV Shows</a>
            <a href="profile.html" class="nav-avatar" id="userAvatar">A</a>
        </div>
    </nav>

    <div class="page-header"><h2>Browse TV Shows</h2><p>Explore our collection organized by genre</p></div>

    <div class="container-fluid px-4">
        <section class="genre-section">
            <h3 class="genre-title">Drama</h3>
            <div class="row" id="dramaShows"></div>
        </section>
        <section class="genre-section">
            <h3 class="genre-title">Comedy</h3>
            <div class="row" id="comedyShows"></div>
        </section>
        <section class="genre-section">
            <h3 class="genre-title">Sci-Fi</h3>
            <div class="row" id="scifiShows"></div>
        </section>
        <section class="genre-section">
            <h3 class="genre-title">Action & Adventure</h3>
            <div class="row" id="actionShows"></div>
        </section>
    </div>

    <script>
        const shows = {
            dramaShows: [
                { id: 1396, title: "Breaking Bad", year: "2008-2013", poster: "https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg" },
                { id: 1399, title: "The Crown", year: "2016-2023", poster: "https://image.tmdb.org/t/p/w500/1M876KPjulVwppEpldhdc8V4o68.jpg" },
                { id: 60059, title: "Better Call Saul", year: "2015-2022", poster: "https://image.tmdb.org/t/p/w500/fC2HDm5t0kHl7mTm7jxMR31b7by.jpg" },
                { id: 100088, title: "The Last of Us", year: "2023-", poster: "https://image.tmdb.org/t/p/w500/uKvVjHNqB5VmOrdxqAt2F7J78ED.jpg" }
            ],
            comedyShows: [
                { id: 1668, title: "Friends", year: "1994-2004", poster: "https://image.tmdb.org/t/p/w500/f496cm9enuEsZkSPzCwnGSEKJwv.jpg" },
                { id: 2316, title: "The Office", year: "2005-2013", poster: "https://image.tmdb.org/t/p/w500/7DJKHzAi83BmQrWLrYYOqcoKfhR.jpg" },
                { id: 48891, title: "Brooklyn Nine-Nine", year: "2013-2021", poster: "https://image.tmdb.org/t/p/w500/hgRMSOt7a1b8qyQR68vUixJPang.jpg" },
                { id: 8592, title: "Parks and Recreation", year: "2009-2015", poster: "https://image.tmdb.org/t/p/w500/dDuzrl9rUIBYieZjqmtNCdncrmZ.jpg" }
            ],
            scifiShows: [
                { id: 66732, title: "Stranger Things", year: "2016-", poster: "https://image.tmdb.org/t/p/w500/49WJfeN0moxb9IPfGn8AIqMGskD.jpg" },
                { id: 42009, title: "Black Mirror", year: "2011-", poster: "https://image.tmdb.org/t/p/w500/5UaYsGZOFhjFDwQix4Nz4T4hZl.jpg" },
                { id: 82856, title: "The Mandalorian", year: "2019-", poster: "https://image.tmdb.org/t/p/w500/eU1i6eHXlzMOlEq0ku1Rzq7Y4wA.jpg" },
                { id: 119051, title: "Fallout", year: "2024-", poster: "https://image.tmdb.org/t/p/w500/7I6VUdPj6tQECNHdviJkUHD2u89.jpg" }
            ],
            actionShows: [
                { id: 76479, title: "The Boys", year: "2019-", poster: "https://image.tmdb.org/t/p/w500/stTEycfG9928HYGEISBFaG1ngjM.jpg" },
                { id: 71912, title: "The Witcher", year: "2019-", poster: "https://image.tmdb.org/t/p/w500/7vjaCdMw15FEbXJPZXCIDlizgk.jpg" },
                { id: 126308, title: "Shogun", year: "2024-", poster: "https://image.tmdb.org/t/p/w500/7O4iVfOMQmdCS1hOg1h7jV8rZ3j.jpg" },
                { id: 44217, title: "Vikings", year: "2013-2020", poster: "https://image.tmdb.org/t/p/w500/bQLrHIRNEkE3PdIWQrZHynQZazu.jpg" }
            ]
        };

        function renderGenre(containerId, items) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = items.map(s => `
                <div class="col-lg-3 col-md-4 col-6 mb-4">
                    <a href="content-detail.html?id=${s.id}&type=tv" style="text-decoration:none;color:inherit;">
                        <div class="movie-card">
                            <img src="${s.poster}" class="movie-poster-img" alt="${s.title}" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x300/1a2d47/F63049?text=${encodeURIComponent(s.title)}';">
                            <p class="movie-title">${s.title}</p>
                            <p class="movie-year">${s.year}</p>
                        </div>
                    </a>
                </div>
            `).join('');
        }

        function goToSearch() {
            const q = document.getElementById('nav-search-input').value.trim();
            if(q) window.location.href = `search.html?q=${encodeURIComponent(q)}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            Object.keys(shows).forEach(k => renderGenre(k, shows[k]));
            const s = localStorage.getItem('watchly_session');
            if(s) document.getElementById('userAvatar').textContent = JSON.parse(s).user.name.charAt(0);
        });
    </script>
</body>
</html>
