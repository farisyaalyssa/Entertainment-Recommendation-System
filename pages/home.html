<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchLy - Home</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg" id="main-navbar">
        <a class="navbar-brand" href="home.html">WatchLy</a>
        <div class="nav-search">
            <input type="text" class="nav-search-input" id="nav-search-input" placeholder="Search movies, TV shows...">
            <button class="nav-search-btn" onclick="goToSearch()">Search</button>
        </div>
        <div class="d-flex align-items-center ml-auto" id="nav-links">
            <a href="home.html" class="nav-link active-link">Home</a>
            <a href="search.html" class="nav-link">Search</a>
            <a href="movies.html" class="nav-link">Movies</a>
            <a href="tvshows.html" class="nav-link">TV Shows</a>
            <a href="profile.html" class="nav-link">My List</a>
            <a href="profile.html" class="nav-avatar" id="userAvatar">A</a>
        </div>
    </nav>

    <section class="hero-carousel" id="heroCarousel">
        <button class="hero-control hero-prev" id="heroPrev"><i class="fas fa-chevron-left"></i></button>
        <button class="hero-control hero-next" id="heroNext"><i class="fas fa-chevron-right"></i></button>
        <div class="hero-indicators" id="heroIndicators"></div>
    </section>

    <main class="content-main" id="dynamic-content">
        <p style="text-align:center; padding: 50px; color: #888;">Loading your personalized recommendations...</p>
    </main>

    <div class="chat-widget">
        <div class="chat-container" id="chatContainer">
            <div class="chat-header">
                <span>Movie Recommender</span>
                <button class="chat-close" onclick="toggleChat()">&times;</button>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="chat-message bot">Hello! Tell me what genre you are in the mood for (drama, action, comedy, sci-fi, romance)!</div>
            </div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chatInput" placeholder="Type your preference..." onkeypress="handleChatKeyPress(event)">
                <button class="chat-send" onclick="sendMessage()">Send</button>
            </div>
        </div>
        <button class="chat-toggle" onclick="toggleChat()">
            <i class="fas fa-comment-dots"></i>
        </button>
    </div>

    <footer class="footer">
        <div class="container"><p>&copy; 2026 WatchLy. All rights reserved.</p></div>
    </footer>

    <script src="../js/api.js"></script>
    <script>
        var TMDB_API_KEY = '434da963b3d04ec74b1a61e704853ac7';
        var TMDB_BASE_URL = 'https://api.themoviedb.org/3';
        var TMDB_IMAGE_URL = 'https://image.tmdb.org/t/p/w500';
        var TMDB_BACKDROP_URL = 'https://image.tmdb.org/t/p/original';

        var GENRE_MAP = {
            'Action': 28, 'Comedy': 35, 'Drama': 18, 'Horror': 27,
            'Sci-Fi': 878, 'Romance': 10749, 'Thriller': 53, 'Animation': 16
        };

        function fetchNowPlayingMovies() {
            var url = TMDB_BASE_URL + '/movie/now_playing?api_key=' + TMDB_API_KEY;
            return fetch(url).then(function(res) { return res.json(); }).then(function(data) {
                return data.results.slice(0, 5); 
            }).catch(function(err) { console.error(err); return []; });
        }

        function fetchMoviesByMultipleGenres(genreIds) {
            var url = TMDB_BASE_URL + '/discover/movie?api_key=' + TMDB_API_KEY + '&with_genres=' + genreIds.join(',') + '&sort_by=popularity.desc';
            return fetch(url).then(function(res) { return res.json(); }).then(function(data) {
                return formatTmdbResults(data.results);
            }).catch(function(err) { console.error(err); return []; });
        }

        function fetchTopMoviesByGenre(genreId) {
            var url = TMDB_BASE_URL + '/discover/movie?api_key=' + TMDB_API_KEY + '&with_genres=' + genreId + '&sort_by=vote_average.desc';
            return fetch(url).then(function(res) { return res.json(); }).then(function(data) {
                return formatTmdbResults(data.results);
            }).catch(function(err) { console.error(err); return []; });
        }

        function fetchTrendingMovies() {
            var url = TMDB_BASE_URL + '/trending/movie/week?api_key=' + TMDB_API_KEY;
            return fetch(url).then(function(res) { return res.json(); }).then(function(data) {
                return formatTmdbResults(data.results);
            }).catch(function(err) { console.error(err); return []; });
        }

        function formatTmdbResults(results) {
            if (!results) return [];
            return results.slice(0, 12).map(function(movie) {
                return {
                    id: movie.id,
                    title: movie.title,
                    year: movie.release_date ? movie.release_date.substring(0, 4) : 'N/A',
                    rating: movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A',
                    contentType: 'movie',
                    poster: movie.poster_path ? TMDB_IMAGE_URL + movie.poster_path : ''
                };
            });
        }

        function setupHeroCarousel(movies) {
            var carousel = document.getElementById('heroCarousel');
            var indicatorsContainer = document.getElementById('heroIndicators');
            
            var oldSlides = carousel.querySelectorAll('.hero-slide');
            for (var i = 0; i < oldSlides.length; i++) {
                oldSlides[i].remove();
            }
            indicatorsContainer.innerHTML = '';

            if (movies.length === 0) return;

            for (var i = 0; i < movies.length; i++) {
                var movie = movies[i];
                var bgUrl = movie.backdrop_path ? TMDB_BACKDROP_URL + movie.backdrop_path : '';
                var year = movie.release_date ? movie.release_date.substring(0, 4) : 'New Release';
                var overview = movie.overview ? movie.overview.substring(0, 150) + '...' : '';

                var slide = document.createElement('div');
                slide.className = 'hero-slide' + (i === 0 ? ' active' : '');
                slide.innerHTML = 
                    '<img src="' + bgUrl + '" alt="' + movie.title + '" class="hero-bg" onerror="this.src=\'https://via.placeholder.com/1920x650/1a2d47/F63049?text=No+Image\'">' +
                    '<div class="hero-overlay"></div>' +
                    '<div class="hero-content">' +
                        '<span class="hero-badge">' + year + '</span>' +
                        '<h1 class="hero-title">' + movie.title + '</h1>' +
                        '<div class="hero-meta"><span class="rating"><i class="fas fa-star"></i> ' + movie.vote_average.toFixed(1) + '</span></div>' +
                        '<p class="hero-description">' + overview + '</p>' +
                        '<div class="hero-buttons">' +
                            '<button class="btn btn-primary" onclick="window.location.href=\'content-detail.html?id=' + movie.id + '&type=movie\'"><i class="fas fa-play"></i> Watch Now</button>' +
                            '<button class="btn btn-secondary" onclick="addToWatchlist(' + movie.id + ', \'movie\')"><i class="fas fa-plus"></i> My List</button>' +
                        '</div>' +
                    '</div>';
                
                carousel.insertBefore(slide, document.getElementById('heroPrev'));

                var indicator = document.createElement('button');
                indicator.className = 'indicator' + (i === 0 ? ' active' : '');
                indicator.onclick = (function(index) {
                    return function() { goToSlide(index); };
                })(i);
                indicatorsContainer.appendChild(indicator);
            }

            var slides = document.querySelectorAll('.hero-slide');
            var indicators = document.querySelectorAll('.indicator');
            var current = 0;
            var total = slides.length;

            function goToSlide(index) {
                slides[current].classList.remove('active');
                indicators[current].classList.remove('active');
                current = index;
                slides[current].classList.add('active');
                indicators[current].classList.add('active');
            }

            document.getElementById('heroPrev').onclick = function() {
                goToSlide((current - 1 + total) % total);
            };
            document.getElementById('heroNext').onclick = function() {
                goToSlide((current + 1) % total);
            };

            setInterval(function() {
                goToSlide((current + 1) % total);
            }, 8000);
        }

        function createRowHTML(title, items) {
            if (!items || items.length === 0) return '';
            
            var cardsHTML = items.map(function(item) {
                return '<a href="content-detail.html?id=' + item.id + '&type=' + item.contentType + '" class="card-link">' +
                    '<div class="content-card">' +
                        '<img src="' + item.poster + '" alt="' + item.title + '" onerror="this.src=\'https://via.placeholder.com/200x300/1a2d47/F63049?text=No+Image\'">' +
                        '<div class="card-overlay">' +
                            '<h4>' + item.title + '</h4>' +
                            '<p><i class="fas fa-star"></i> ' + item.rating + '</p>' +
                            '<button class="btn-add" onclick="event.stopPropagation(); addToWatchlist(' + item.id + ', \'' + item.contentType + '\'); return false;"><i class="fas fa-plus"></i></button>' +
                        '</div>' +
                    '</div>' +
                '</a>';
            }).join('');

            return '<section class="content-row">' +
                '<div class="row-header"><h2 class="row-title">' + title + '</h2></div>' +
                '<div class="row-content">' + cardsHTML + '</div>' +
            '</section>';
        }

        function appendRow(title, items) {
            var container = document.getElementById('dynamic-content');
            var rowHTML = createRowHTML(title, items);
            if (rowHTML) {
                container.innerHTML += rowHTML;
            }
        }

        async function loadPersonalizedHome() {
            var container = document.getElementById('dynamic-content');
            container.innerHTML = ''; 

            var nowPlaying = await fetchNowPlayingMovies();
            setupHeroCarousel(nowPlaying);

            var userGenres = [];
            try {
                var profileData = await apiFetch('/api/users/profile');
                if (profileData.user && profileData.user.preferences && profileData.user.preferences.genres) {
                    userGenres = profileData.user.preferences.genres;
                }
            } catch (error) {
                console.log('Could not fetch profile, using defaults.');
            }

            var genreIds = [];
            userGenres.forEach(function(g) {
                if (GENRE_MAP[g]) genreIds.push(GENRE_MAP[g]);
            });

            if (genreIds.length > 0) {
                var mixedMovies = await fetchMoviesByMultipleGenres(genreIds);
                appendRow('Recommended For You (Based on your mix)', mixedMovies);

                for (var i = 0; i < Math.min(userGenres.length, 2); i++) {
                    var genreName = userGenres[i];
                    var genreId = GENRE_MAP[genreName];
                    var topMovies = await fetchTopMoviesByGenre(genreId);
                    appendRow('Top Rated ' + genreName + ' Movies', topMovies);
                }
            } else {
                var trending = await fetchTrendingMovies();
                appendRow('Trending Now', trending);
            }

            var trendingBottom = await fetchTrendingMovies();
            appendRow('Trending This Week', trendingBottom);
        }

        async function addToWatchlist(contentId, contentType) {
            var userId = getCurrentUserId();
            if (!userId) { alert('Please log in to add to watchlist'); return; }

            try {
                var response = await fetch('http://localhost:3000/api/watchlist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getAuthToken() },
                    body: JSON.stringify({ userId: userId, contentId: contentId, contentType: contentType })
                });
                var data = await response.json();
                alert(response.ok ? 'Added to watchlist!' : (data.message || 'Failed to add'));
            } catch (error) {
                alert('Error adding to watchlist.');
            }
        }

        function goToSearch() {
            var q = document.getElementById('nav-search-input').value.trim();
            if (q) window.location.href = 'search.html?q=' + encodeURIComponent(q);
        }

        function toggleChat() { 
            document.getElementById('chatContainer').classList.toggle('active'); 
        }
        
        function handleChatKeyPress(e) { 
            if (e.key === 'Enter') sendMessage(); 
        }
        
        function addMessage(text, type) {
            var div = document.createElement('div');
            div.className = 'chat-message ' + type;
            div.innerHTML = text;
            var container = document.getElementById('chatMessages');
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            var input = document.getElementById('chatInput');
            var query = input.value.trim();
            if (!query) return;
            
            addMessage(query, 'user');
            input.value = '';
            
            setTimeout(function() {
                processChatQuery(query);
            }, 500);
        }

        function getGenreIdFromKeyword(keyword) {
            var keywordLower = keyword.toLowerCase();
            
            if (keywordLower.indexOf('action') > -1) return 28;
            if (keywordLower.indexOf('comedy') > -1) return 35;
            if (keywordLower.indexOf('drama') > -1) return 18;
            if (keywordLower.indexOf('horror') > -1) return 27;
            if (keywordLower.indexOf('sci') > -1 || keywordLower.indexOf('science') > -1) return 878;
            if (keywordLower.indexOf('romance') > -1 || keywordLower.indexOf('love') > -1) return 10749;
            if (keywordLower.indexOf('thriller') > -1) return 53;
            if (keywordLower.indexOf('animation') > -1 || keywordLower.indexOf('cartoon') > -1) return 16;
            
            return null;
        }
        function processChatQuery(query) {
            var genreId = getGenreIdFromKeyword(query);
            
            if (genreId) {
                addMessage('<i class="fas fa-spinner fa-spin"></i> Finding movies...', 'bot');
                
                var url = TMDB_BASE_URL + '/discover/movie?api_key=' + TMDB_API_KEY + 
                          '&with_genres=' + genreId + 
                          '&sort_by=popularity.desc&language=en-US';
                
                fetch(url).then(function(res) { 
                    return res.json(); 
                }).then(function(data) {
                    var movies = data.results.slice(0, 5);
                    var loadingMsg = document.querySelector('.chat-message.bot:last-child');
                    if (loadingMsg && loadingMsg.innerHTML.indexOf('spinner') > -1) {
                        loadingMsg.remove();
                    }
                    
                    if (movies.length > 0) {
                        var msg = '<strong>Here are some recommendations:</strong><br><br>';
                        movies.forEach(function(movie) {
                            var year = movie.release_date ? movie.release_date.substring(0, 4) : 'N/A';
                            var rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';
                            msg += '🎬 <strong>' + movie.title + '</strong> (' + year + ') - Rating: ' + rating + '<br>';
                        });
                        msg += '<br><em>Click on any movie card on the home page to view details!</em>';
                        addMessage(msg, 'bot');
                    } else {
                        addMessage("I couldn't find any movies for that genre. Try another one!", 'bot');
                    }
                }).catch(function(err) {
                    console.error('Chatbot search error:', err);
                    addMessage("Sorry, I had trouble finding movies right now.", 'bot');
                });
            } else {
                addMessage("I can help you find movies by genre! Try typing: <em>action</em>, <em>comedy</em>, <em>drama</em>, <em>sci-fi</em>, <em>horror</em>, <em>romance</em>, <em>thriller</em>, or <em>animation</em>", 'bot');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateNavAvatar();
            loadPersonalizedHome();
        });
    </script>
</body>
</html>
