<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchLy — Content Detail</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg" id="main-navbar">
        <div class="back-btn-wrap">
            <button class="btn-back" onclick="history.back()">&#8592; Back</button>
        </div>
        <a class="navbar-brand" href="home.html">WatchLy</a>
        <div class="nav-search">
            <input type="text" class="nav-search-input" id="nav-search-input" placeholder="Search movies, TV shows...">
            <button class="nav-search-btn" onclick="goToSearch()">Search</button>
        </div>
        <div class="d-flex align-items-center" id="nav-links">
            <a href="home.html" class="nav-link">Home</a>
            <a href="search.html" class="nav-link">Search</a>
            <a href="movies.html" class="nav-link">Movies</a>
            <a href="tvshows.html" class="nav-link">TV Shows</a>
            <a href="profile.html" class="nav-link">My List</a>
            <a href="profile.html" class="nav-avatar" id="userAvatar">A</a>
        </div>
    </nav>

    <!-- BACKDROP -->
    <div id="backdrop-section" class="detail-backdrop">
        <div class="detail-backdrop-overlay"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container-fluid detail-content">
        <div class="row">

            <!-- LEFT — Poster -->
            <div class="col-lg-3 col-md-4 text-center">
                <img id="detail-poster" src="" alt="Poster" class="detail-poster">
            </div>

            <!-- RIGHT — Details -->
            <div class="col-lg-9 col-md-8">

                <!-- Title and meta -->
                <h1 id="detail-title" class="detail-title"></h1>
                <div class="detail-meta" id="detail-meta"></div>
                <div class="detail-genres" id="detail-genres"></div>
                <p id="detail-overview" class="detail-overview"></p>

                <!-- Action buttons -->
                <!-- Action buttons -->
                <div class="detail-actions">
                    <button class="btn-watchlist" id="watchlist-btn" onclick="toggleWatchlist()">
                        + Add to Watchlist
                    </button>
                    <button class="btn-favourite" id="favourite-btn" onclick="toggleFavourite()">
                        ♡ Add to Favourites
                    </button>
                    <button class="btn-watched" id="watched-btn" onclick="toggleWatched()">
                        Mark as Watched
                    </button>
                </div>

                <hr class="profile-divider">

                <!-- RATE -->
<div class="detail-section">
    <p class="detail-section-title">Rate this</p>
    <div class="star-rating" id="star-rating">
        <span class="star" onclick="setRating(1)">★</span>
        <span class="star" onclick="setRating(2)">★</span>
        <span class="star" onclick="setRating(3)">★</span>
        <span class="star" onclick="setRating(4)">★</span>
        <span class="star" onclick="setRating(5)">★</span>
        <span class="star" onclick="setRating(6)">★</span>
        <span class="star" onclick="setRating(7)">★</span>
        <span class="star" onclick="setRating(8)">★</span>
        <span class="star" onclick="setRating(9)">★</span>
        <span class="star" onclick="setRating(10)">★</span>
    </div>
    <p class="rating-feedback" id="rating-feedback"></p>
</div>

                <hr class="profile-divider">

                <!-- WRITE A REVIEW -->
                <div class="detail-section">
                    <p class="detail-section-title">Write a Review</p>
                    <textarea
                        class="form-input review-input"
                        id="review-input"
                        placeholder="Share your thoughts about this movie or show..."
                    ></textarea>
                    <button class="btn-save mt-2" onclick="submitReview()">Submit Review</button>

                    <!-- Submitted reviews -->
                    <div id="reviews-list" class="mt-3"></div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>

        var API_KEY = '9702460f55f5b08f0ad2c93b27dcebf3';
        var BASE_URL = 'https://api.themoviedb.org/3';
        var IMG_URL = 'https://image.tmdb.org/t/p/';

        var params = new URLSearchParams(window.location.search);
        var contentId = params.get('id');
        var contentType = params.get('type') || 'movie';

        var contentData = null;
        var currentRating = 0;
        var userReviewId = null;
        var inWatchlist = false;
        var inFavourites = false;
        var isWatched = false;

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.onload = function() {
            if (!contentId) {
                document.querySelector('.detail-content').innerHTML = '<p class="text-center mt-5">No content selected.</p>';
                return;
            }

            fetch(BASE_URL + '/' + contentType + '/' + contentId + '?api_key=' + API_KEY)
                .then(function(res) { return res.json(); })
                .then(function(data) { renderContent(data); })
                .catch(function() {
                    document.querySelector('.detail-content').innerHTML = '<p class="text-center mt-5">Failed to load content. Check your API key.</p>';
                });
        };

        function renderContent(data) {
            var title = data.title || data.name;
            var year = (data.release_date || data.first_air_date || '').substring(0, 4);
            var rating = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
            var runtime = data.runtime ? data.runtime + ' min' : (data.episode_run_time ? data.episode_run_time[0] + ' min/ep' : '');
            var overview = data.overview || 'No description available.';
            var poster = data.poster_path ? IMG_URL + 'w500' + data.poster_path : '';
            var backdrop = data.backdrop_path ? IMG_URL + 'original' + data.backdrop_path : '';
            var genres = data.genres || [];

            contentData = {
                tmdbId: Number(contentId),
                type: contentType,
                title: title,
                poster: poster
            };

            document.title = 'WatchLy — ' + title;

            if (backdrop) {
                document.getElementById('backdrop-section').style.backgroundImage = 'url(' + backdrop + ')';
            }

            document.getElementById('detail-poster').src = poster;
            document.getElementById('detail-poster').alt = title;
            document.getElementById('detail-title').textContent = title;
            document.getElementById('detail-meta').innerHTML =
                '<span class="meta-tag">' + year + '</span>' +
                '<span class="meta-tag">★ ' + rating + '</span>' +
                (runtime ? '<span class="meta-tag">' + runtime + '</span>' : '');

            document.getElementById('detail-genres').innerHTML = genres.map(function(g) {
                return '<span class="genre-tag">' + g.name + '</span>';
            }).join('');

            document.getElementById('detail-overview').textContent = overview;

            if (getAuthToken()) {
                loadUserStatus();
            } else {
                loadReviews();
            }
        }

        function updateWatchlistBtn() {
            var btn = document.getElementById('watchlist-btn');
            if (inWatchlist) {
                btn.textContent = 'Added to Watchlist';
                btn.classList.add('btn-watchlist-added');
            } else {
                btn.textContent = '+ Add to Watchlist';
                btn.classList.remove('btn-watchlist-added');
            }
        }

        function updateFavouriteBtn() {
            var btn = document.getElementById('favourite-btn');
            if (inFavourites) {
                btn.textContent = '♥ Added to Favourites';
                btn.classList.add('btn-favourite-added');
            } else {
                btn.textContent = '♡ Add to Favourites';
                btn.classList.remove('btn-favourite-added');
            }
        }

        function updateWatchedBtn() {
            var btn = document.getElementById('watched-btn');
            if (isWatched) {
                btn.textContent = 'Watched';
                btn.classList.add('btn-watched-added');
            } else {
                btn.textContent = 'Mark as Watched';
                btn.classList.remove('btn-watched-added');
            }
        }

        function loadUserStatus() {
            Promise.all([
                apiFetch('/api/watchlist'),
                apiFetch('/api/favourites'),
                apiFetch('/api/history')
            ]).then(function(results) {
                var tmdbId = Number(contentId);

                inWatchlist = results[0].items.some(function(item) {
                    return item.tmdbId === tmdbId && item.type === contentType;
                });
                inFavourites = results[1].items.some(function(item) {
                    return item.tmdbId === tmdbId && item.type === contentType;
                });
                isWatched = results[2].items.some(function(item) {
                    return item.tmdbId === tmdbId && item.type === contentType;
                });

                updateWatchlistBtn();
                updateFavouriteBtn();
                updateWatchedBtn();
            }).catch(function(err) {
                console.error('Failed to load user status:', err.message);
            });

            loadReviews();
        }

        function toggleWatchlist() {
            if (!contentData) return;

            if (inWatchlist) {
                apiFetch('/api/watchlist/' + contentData.tmdbId + '?type=' + contentType, {
                    method: 'DELETE'
                }).then(function() {
                    inWatchlist = false;
                    updateWatchlistBtn();
                }).catch(function(err) {
                    alert(err.message);
                });
            } else {
                apiFetch('/api/watchlist', {
                    method: 'POST',
                    body: JSON.stringify({
                        tmdbId: contentData.tmdbId,
                        type: contentData.type,
                        title: contentData.title,
                        poster: contentData.poster
                    })
                }).then(function() {
                    inWatchlist = true;
                    updateWatchlistBtn();
                }).catch(function(err) {
                    alert(err.message);
                });
            }
        }

        function toggleFavourite() {
            if (!contentData) return;

            if (inFavourites) {
                apiFetch('/api/favourites/' + contentData.tmdbId + '?type=' + contentType, {
                    method: 'DELETE'
                }).then(function() {
                    inFavourites = false;
                    updateFavouriteBtn();
                }).catch(function(err) {
                    alert(err.message);
                });
            } else {
                apiFetch('/api/favourites', {
                    method: 'POST',
                    body: JSON.stringify({
                        tmdbId: contentData.tmdbId,
                        type: contentData.type,
                        title: contentData.title,
                        poster: contentData.poster
                    })
                }).then(function() {
                    inFavourites = true;
                    updateFavouriteBtn();
                }).catch(function(err) {
                    alert(err.message);
                });
            }
        }

        function toggleWatched() {
            if (!contentData) return;

            if (isWatched) {
                alert('This title is already in your watch history.');
                return;
            }

            apiFetch('/api/history', {
                method: 'POST',
                body: JSON.stringify({
                    tmdbId: contentData.tmdbId,
                    type: contentData.type,
                    title: contentData.title,
                    poster: contentData.poster
                })
            }).then(function() {
                isWatched = true;
                updateWatchedBtn();
            }).catch(function(err) {
                alert(err.message);
            });
        }

        function updateRatingUI(val) {
            currentRating = val;
            var stars = document.querySelectorAll('.star');
            stars.forEach(function(star, index) {
                star.classList.toggle('star-filled', index < val);
            });
            var labels = ['', 'Terrible', 'Bad', 'Poor', 'Below Average', 'Average', 'Fine', 'Good', 'Great', 'Excellent', 'Masterpiece'];
            document.getElementById('rating-feedback').textContent = val + '/10 — ' + labels[val];
        }

        function setRating(val) {
            updateRatingUI(val);

            if (userReviewId) {
                apiFetch('/api/reviews/' + userReviewId, {
                    method: 'PUT',
                    body: JSON.stringify({ rating: val })
                }).catch(function(err) {
                    alert(err.message);
                });
            }
        }

        function submitReview() {
            if (!contentData) return;

            var text = document.getElementById('review-input').value.trim();
            if (currentRating === 0) {
                alert('Please select a rating first.');
                return;
            }
            if (!text) {
                alert('Write something first!');
                return;
            }

            if (userReviewId) {
                apiFetch('/api/reviews/' + userReviewId, {
                    method: 'PUT',
                    body: JSON.stringify({
                        rating: currentRating,
                        review: text
                    })
                }).then(function() {
                    document.getElementById('review-input').value = '';
                    loadReviews();
                }).catch(function(err) {
                    alert(err.message);
                });
            } else {
                apiFetch('/api/reviews', {
                    method: 'POST',
                    body: JSON.stringify({
                        tmdbId: contentData.tmdbId,
                        type: contentData.type,
                        rating: currentRating,
                        review: text
                    })
                }).then(function() {
                    document.getElementById('review-input').value = '';
                    loadReviews();
                }).catch(function(err) {
                    alert(err.message);
                });
            }
        }

        function loadReviews() {
            if (!contentId || !getAuthToken()) {
                document.getElementById('reviews-list').innerHTML = '';
                return;
            }

            apiFetch('/api/reviews?tmdbId=' + contentId + '&type=' + contentType)
                .then(function(data) {
                    var list = document.getElementById('reviews-list');
                    var reviews = data.reviews || [];
                    var currentUserId = getCurrentUserId();

                    userReviewId = null;
                    reviews.forEach(function(review) {
                        if (currentUserId && String(review.userId) === String(currentUserId)) {
                            userReviewId = review.id;
                            updateRatingUI(review.rating);
                            document.getElementById('review-input').value = review.review;
                        }
                    });

                    if (reviews.length === 0) {
                        list.innerHTML = '';
                        return;
                    }

                    list.innerHTML = reviews.map(function(review) {
                        var author = review.user
                            ? escapeHtml(review.user.name) + ' (@' + escapeHtml(review.user.username) + ')'
                            : 'Anonymous';
                        return '<div class="review-card mb-3">' +
                            '<p class="review-author"><strong>' + author + '</strong></p>' +
                            '<p class="review-rating">★ ' + review.rating + '/10</p>' +
                            '<p class="review-text">' + escapeHtml(review.review) + '</p>' +
                            '</div>';
                    }).join('');
                })
                .catch(function(err) {
                    console.error('Failed to load reviews:', err.message);
                    document.getElementById('reviews-list').innerHTML = '';
                });
        }

        function goToSearch() {
            var query = document.getElementById('nav-search-input').value.trim();
            if (query) {
                window.location.href = 'search.html?q=' + encodeURIComponent(query);
            }
        }
    </script>

</body>
</html>
