<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchLy — Content Detail</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg" id="main-navbar">
        <div class="back-btn-wrap">
            <button class="btn-back" onclick="history.back()">&#8592; Back</button>
        </div>
        <a class="navbar-brand" href="home.html">WatchLy</a>
        <div class="nav-search">
            <input type="text" class="nav-search-input" id="nav-search-input" placeholder="Search movies, TV shows...">
            <button class="nav-search-btn" onclick="goToSearch()">Search</button>
        </div>
        <div class="d-flex align-items-center" id="nav-links">
            <a href="home.html" class="nav-link">Home</a>
            <a href="search.html" class="nav-link">Search</a>
            <a href="movies.html" class="nav-link">Movies</a>
            <a href="tvshows.html" class="nav-link">TV Shows</a>
            <a href="profile.html" class="nav-link">My List</a>
            <a href="profile.html" class="nav-avatar" id="userAvatar">A</a>
        </div>
    </nav>

    <!-- BACKDROP -->
    <div id="backdrop-section" class="detail-backdrop">
        <div class="detail-backdrop-overlay"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container-fluid detail-content">
        <div class="row">

            <!-- LEFT — Poster -->
            <div class="col-lg-3 col-md-4 text-center">
                <img id="detail-poster" src="" alt="Poster" class="detail-poster">
            </div>

            <!-- RIGHT — Details -->
            <div class="col-lg-9 col-md-8">

                <!-- Title and meta -->
                <h1 id="detail-title" class="detail-title"></h1>
                <div class="detail-meta" id="detail-meta"></div>
                <div class="detail-genres" id="detail-genres"></div>
                <p id="detail-overview" class="detail-overview"></p>

                <!-- Action buttons -->
                <!-- Action buttons -->
                <div class="detail-actions">
                    <button class="btn-watchlist" id="watchlist-btn" onclick="toggleWatchlist()">
                        + Add to Watchlist
                    </button>
                    <button class="btn-favourite" id="favourite-btn" onclick="toggleFavourite()">
                        ♡ Add to Favourites
                    </button>
                    <button class="btn-watched" id="watched-btn" onclick="toggleWatched()">
                        Mark as Watched
                    </button>
                </div>

                <hr class="profile-divider">

                <!-- REVIEWS -->
                <div class="detail-section">
                    <div class="review-section-header">
                        <p class="detail-section-title">Reviews</p>
                        <button type="button" class="btn-write-review" id="write-review-btn" style="display:none;" onclick="openReviewForm()">
                            Write a Review
                        </button>
                    </div>

                    <div id="reviews-list" class="mt-3"></div>

                    <div id="review-form-panel" class="review-form-panel mt-3" style="display:none;">
                        <p class="detail-section-title" id="review-section-title">Write a Review</p>
                        <p class="review-hint text-muted" id="review-hint" style="display:none;">
                            Editing one of your reviews. Save changes or cancel when you are done.
                        </p>

                        <div class="star-rating" id="star-rating">
                            <span class="star" onclick="setRating(1)">★</span>
                            <span class="star" onclick="setRating(2)">★</span>
                            <span class="star" onclick="setRating(3)">★</span>
                            <span class="star" onclick="setRating(4)">★</span>
                            <span class="star" onclick="setRating(5)">★</span>
                            <span class="star" onclick="setRating(6)">★</span>
                            <span class="star" onclick="setRating(7)">★</span>
                            <span class="star" onclick="setRating(8)">★</span>
                            <span class="star" onclick="setRating(9)">★</span>
                            <span class="star" onclick="setRating(10)">★</span>
                        </div>
                        <p class="rating-feedback" id="rating-feedback"></p>

                        <textarea
                            class="form-input review-input"
                            id="review-input"
                            placeholder="Share your thoughts about this movie or show..."
                        ></textarea>
                        <div class="review-form-actions">
                            <button type="button" class="btn-save" id="review-submit-btn" onclick="submitReview()">Submit Review</button>
                            <button type="button" class="btn-cancel" id="review-cancel-btn" onclick="closeReviewForm()">Cancel</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>

        var params = new URLSearchParams(window.location.search);
        var contentId = params.get('id');
        var contentType = params.get('type') || 'movie';

        var contentData = null;
        var currentRating = 0;
        var userReviewId = null;
        var loadedReviews = [];
        var reviewFormOpen = false;
        var inWatchlist = false;
        var inFavourites = false;
        var isWatched = false;

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.onload = function() {
            if (!contentId) {
                document.querySelector('.detail-content').innerHTML = '<p class="text-center mt-5">No content selected.</p>';
                return;
            }

            apiPublic('/api/content/' + contentType + '/' + contentId)
                .then(function(data) {
                    if (!data.content) {
                        throw new Error('Content not found.');
                    }
                    renderContent(data.content);
                })
                .catch(function(err) {
                    document.querySelector('.detail-content').innerHTML =
                        '<p class="text-center mt-5">Failed to load content. ' + escapeHtml(err.message) + '</p>';
                });
        };

        function renderContent(data) {
            var title = data.title;
            var year = data.year || '';
            var rating = data.rating !== null && data.rating !== undefined ? data.rating : 'N/A';
            var runtime = data.runtime || '';
            var overview = data.overview || 'No description available.';
            var poster = data.poster || '';
            var backdrop = data.backdrop || '';
            var genres = data.genres || [];

            contentData = {
                tmdbId: Number(contentId),
                type: contentType,
                title: title,
                poster: poster
            };

            document.title = 'WatchLy — ' + title;

            if (backdrop) {
                document.getElementById('backdrop-section').style.backgroundImage = 'url(' + backdrop + ')';
            }

            document.getElementById('detail-poster').src = poster;
            document.getElementById('detail-poster').alt = title;
            document.getElementById('detail-title').textContent = title;
            document.getElementById('detail-meta').innerHTML =
                '<span class="meta-tag">' + year + '</span>' +
                '<span class="meta-tag">★ ' + rating + '</span>' +
                (runtime ? '<span class="meta-tag">' + runtime + '</span>' : '');

            document.getElementById('detail-genres').innerHTML = genres.map(function(name) {
                return '<span class="genre-tag">' + escapeHtml(name) + '</span>';
            }).join('');

            document.getElementById('detail-overview').textContent = overview;

            if (getAuthToken()) {
                loadUserStatus();
            } else {
                loadReviews();
            }
        }

        function updateWatchlistBtn() {
            var btn = document.getElementById('watchlist-btn');
            if (inWatchlist) {
                btn.textContent = 'Added to Watchlist';
                btn.classList.add('btn-watchlist-added');
            } else {
                btn.textContent = '+ Add to Watchlist';
                btn.classList.remove('btn-watchlist-added');
            }
        }

        function updateFavouriteBtn() {
            var btn = document.getElementById('favourite-btn');
            if (inFavourites) {
                btn.textContent = '♥ Added to Favourites';
                btn.classList.add('btn-favourite-added');
            } else {
                btn.textContent = '♡ Add to Favourites';
                btn.classList.remove('btn-favourite-added');
            }
        }

        function updateWatchedBtn() {
            var btn = document.getElementById('watched-btn');
            if (isWatched) {
                btn.textContent = 'Watched';
                btn.classList.add('btn-watched-added');
            } else {
                btn.textContent = 'Mark as Watched';
                btn.classList.remove('btn-watched-added');
            }
        }

        function loadUserStatus() {
            Promise.all([
                apiFetch('/api/watchlist'),
                apiFetch('/api/favourites'),
                apiFetch('/api/history')
            ]).then(function(results) {
                var tmdbId = Number(contentId);

                inWatchlist = results[0].items.some(function(item) {
                    return item.tmdbId === tmdbId && item.type === contentType;
                });
                inFavourites = results[1].items.some(function(item) {
                    return item.tmdbId === tmdbId && item.type === contentType;
                });
                isWatched = results[2].items.some(function(item) {
                    return item.tmdbId === tmdbId && item.type === contentType;
                });

                updateWatchlistBtn();
                updateFavouriteBtn();
                updateWatchedBtn();
            }).catch(function(err) {
                console.error('Failed to load user status:', err.message);
            });

            loadReviews();
        }

        function toggleWatchlist() {
            if (!contentData) return;

            if (inWatchlist) {
                apiFetch('/api/watchlist/' + contentData.tmdbId + '?type=' + contentType, {
                    method: 'DELETE'
                }).then(function() {
                    inWatchlist = false;
                    updateWatchlistBtn();
                }).catch(function(err) {
                    alert(err.message);
                });
            } else {
                apiFetch('/api/watchlist', {
                    method: 'POST',
                    body: JSON.stringify({
                        tmdbId: contentData.tmdbId,
                        type: contentData.type,
                        title: contentData.title,
                        poster: contentData.poster
                    })
                }).then(function() {
                    inWatchlist = true;
                    updateWatchlistBtn();
                }).catch(function(err) {
                    alert(err.message);
                });
            }
        }

        function toggleFavourite() {
            if (!contentData) return;

            if (inFavourites) {
                apiFetch('/api/favourites/' + contentData.tmdbId + '?type=' + contentType, {
                    method: 'DELETE'
                }).then(function() {
                    inFavourites = false;
                    updateFavouriteBtn();
                }).catch(function(err) {
                    alert(err.message);
                });
            } else {
                apiFetch('/api/favourites', {
                    method: 'POST',
                    body: JSON.stringify({
                        tmdbId: contentData.tmdbId,
                        type: contentData.type,
                        title: contentData.title,
                        poster: contentData.poster
                    })
                }).then(function() {
                    inFavourites = true;
                    updateFavouriteBtn();
                }).catch(function(err) {
                    alert(err.message);
                });
            }
        }

        function toggleWatched() {
            if (!contentData) return;

            if (isWatched) {
                apiFetch('/api/history/' + contentData.tmdbId + '?type=' + contentType, {
                    method: 'DELETE'
                }).then(function() {
                    isWatched = false;
                    updateWatchedBtn();
                }).catch(function(err) {
                    alert(err.message);
                });
            } else {
                apiFetch('/api/history', {
                    method: 'POST',
                    body: JSON.stringify({
                        tmdbId: contentData.tmdbId,
                        type: contentData.type,
                        title: contentData.title,
                        poster: contentData.poster
                    })
                }).then(function() {
                    isWatched = true;
                    updateWatchedBtn();
                }).catch(function(err) {
                    alert(err.message);
                });
            }
        }

        function isCurrentUserReview(review, currentUserId) {
            if (!currentUserId || !review) return false;

            var reviewUserId = review.userId;
            if (reviewUserId && typeof reviewUserId === 'object') {
                reviewUserId = reviewUserId._id || reviewUserId.id;
            }

            return String(reviewUserId) === String(currentUserId);
        }

        function updateReviewFormUI() {
            var editing = Boolean(userReviewId);
            document.getElementById('review-section-title').textContent = editing ? 'Edit Review' : 'Write a Review';
            document.getElementById('review-submit-btn').textContent = editing ? 'Save Changes' : 'Submit Review';
            document.getElementById('review-hint').style.display = editing ? 'block' : 'none';
            document.getElementById('review-form-panel').style.display = reviewFormOpen ? 'block' : 'none';
            document.getElementById('write-review-btn').style.display =
                getAuthToken() && !reviewFormOpen ? 'inline-block' : 'none';
        }

        function userHasReviews(currentUserId) {
            return loadedReviews.some(function(review) {
                return isCurrentUserReview(review, currentUserId);
            });
        }

        function updateWriteReviewButton(currentUserId) {
            var button = document.getElementById('write-review-btn');
            button.textContent = userHasReviews(currentUserId) ? 'Add Another Review' : 'Write a Review';
        }

        function openReviewForm() {
            userReviewId = null;
            reviewFormOpen = true;
            resetReviewFormFields();
            updateReviewFormUI();
            document.getElementById('review-input').focus();
        }

        function closeReviewForm() {
            userReviewId = null;
            reviewFormOpen = false;
            resetReviewFormFields();
            updateReviewFormUI();
        }

        function editReview(reviewId) {
            var review = loadedReviews.find(function(item) {
                return String(item.id) === String(reviewId);
            });

            if (!review) return;

            userReviewId = review.id;
            reviewFormOpen = true;
            updateRatingUI(review.rating);
            document.getElementById('review-input').value = review.review;
            updateReviewFormUI();
            document.getElementById('review-input').focus();
        }

        function deleteReview(reviewId) {
            if (!confirm('Delete this review?')) return;

            apiFetch('/api/reviews/' + reviewId, {
                method: 'DELETE'
            }).then(function() {
                if (String(userReviewId) === String(reviewId)) {
                    closeReviewForm();
                }
                loadReviews();
            }).catch(function(err) {
                alert(err.message);
            });
        }

        function resetReviewFormFields() {
            currentRating = 0;
            document.querySelectorAll('.star').forEach(function(star) {
                star.classList.remove('star-filled');
            });
            document.getElementById('rating-feedback').textContent = '';
            document.getElementById('review-input').value = '';
        }

        function updateRatingUI(val) {
            currentRating = val;
            var stars = document.querySelectorAll('.star');
            stars.forEach(function(star, index) {
                star.classList.toggle('star-filled', index < val);
            });
            var labels = ['', 'Terrible', 'Bad', 'Poor', 'Below Average', 'Average', 'Fine', 'Good', 'Great', 'Excellent', 'Masterpiece'];
            document.getElementById('rating-feedback').textContent = val + '/10 — ' + labels[val];
        }

        function setRating(val) {
            updateRatingUI(val);

            if (userReviewId) {
                apiFetch('/api/reviews/' + userReviewId, {
                    method: 'PUT',
                    body: JSON.stringify({ rating: val })
                }).catch(function(err) {
                    alert(err.message);
                });
            }
        }

        function submitReview() {
            if (!contentData) return;

            var text = document.getElementById('review-input').value.trim();
            if (currentRating === 0) {
                alert('Please select a rating first.');
                return;
            }
            if (!text) {
                alert('Write something first!');
                return;
            }

            if (userReviewId) {
                apiFetch('/api/reviews/' + userReviewId, {
                    method: 'PUT',
                    body: JSON.stringify({
                        rating: currentRating,
                        review: text
                    })
                }).then(function() {
                    closeReviewForm();
                    loadReviews();
                }).catch(function(err) {
                    alert(err.message);
                });
            } else {
                apiFetch('/api/reviews', {
                    method: 'POST',
                    body: JSON.stringify({
                        tmdbId: contentData.tmdbId,
                        type: contentData.type,
                        rating: currentRating,
                        review: text
                    })
                }).then(function() {
                    closeReviewForm();
                    loadReviews();
                }).catch(function(err) {
                    alert(err.message);
                });
            }
        }

        function loadReviews() {
            if (!contentId || !getAuthToken()) {
                document.getElementById('reviews-list').innerHTML = '';
                reviewFormOpen = false;
                updateReviewFormUI();
                return;
            }

            apiFetch('/api/reviews?tmdbId=' + contentId + '&type=' + contentType)
                .then(function(data) {
                    var list = document.getElementById('reviews-list');
                    var reviews = data.reviews || [];
                    var currentUserId = getCurrentUserId();

                    loadedReviews = reviews;
                    updateWriteReviewButton(currentUserId);
                    updateReviewFormUI();

                    if (reviews.length === 0) {
                        list.innerHTML = '<p class="reviews-empty">No reviews yet. Be the first to share your thoughts.</p>';
                        return;
                    }

                    list.innerHTML = reviews.map(function(review) {
                        var isMine = isCurrentUserReview(review, currentUserId);
                        var author = review.user
                            ? escapeHtml(review.user.name) + ' <span class="review-username">@' + escapeHtml(review.user.username) + '</span>'
                            : 'Anonymous';
                        var cardClass = 'review-card mb-3' + (isMine ? ' review-card--mine' : '');
                        var actions = isMine
                            ? '<div class="review-actions">' +
                                '<button type="button" class="btn-review-action" onclick="editReview(\'' + review.id + '\')">Edit</button>' +
                                '<button type="button" class="btn-review-action btn-review-action--danger" onclick="deleteReview(\'' + review.id + '\')">Delete</button>' +
                                '</div>'
                            : '';
                        return '<div class="' + cardClass + '">' +
                            '<div class="review-card-header">' +
                            '<p class="review-author">' + author + '</p>' +
                            '<span class="review-rating">★ ' + review.rating + '/10</span>' +
                            '</div>' +
                            '<p class="review-text">' + escapeHtml(review.review) + '</p>' +
                            actions +
                            '</div>';
                    }).join('');
                })
                .catch(function(err) {
                    console.error('Failed to load reviews:', err.message);
                    document.getElementById('reviews-list').innerHTML = '';
                });
        }

        function goToSearch() {
            var query = document.getElementById('nav-search-input').value.trim();
            if (query) {
                window.location.href = 'search.html?q=' + encodeURIComponent(query);
            }
        }
    </script>

</body>
</html>
