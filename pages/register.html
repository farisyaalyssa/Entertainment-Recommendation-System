<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchLy - Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="../index.html" class="auth-logo">WatchLy</a>
        <div class="auth-box">
            <h1>Create your account</h1>
            <div id="registerError" class="alert alert-error"></div>
            <form id="registerForm" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="firstName" class="form-control" placeholder="Azri" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="lastName" class="form-control" placeholder="Zafran" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="regEmail" class="form-control" placeholder="azri@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="regPassword" class="form-control" placeholder="Create a password" required oninput="checkStrength(this.value)">
                        <button type="button" class="toggle-password" onclick="togglePass('regPassword', this)"><i class="fas fa-eye"></i></button>
                    </div>
                    <div class="password-strength"><div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div><span class="strength-text" id="strengthText">Password strength</span></div>
                </div>
                <div class="form-group">
                    <label class="checkbox-label terms-checkbox"><input type="checkbox" id="agreeTerms" required><span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></span></label>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>
            <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
        </div>
    </div>
    <script src="../js/auth.js"></script>
    <script>
        function togglePass(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
            else { input.type = 'password'; icon.className = 'fas fa-eye'; }
        }
        function checkStrength(pwd) {
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            let score = (pwd.length >= 8) + (/[A-Z]/.test(pwd)) + (/[0-9]/.test(pwd));
            fill.className = 'strength-fill';
            if (score <= 1) { fill.classList.add('weak'); text.textContent = 'Weak'; }
            else if (score === 2) { fill.classList.add('fair'); text.textContent = 'Fair'; }
            else { fill.classList.add('good'); text.textContent = 'Strong'; }
        }
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!this.checkValidity()) { this.reportValidity(); return; }
            const user = {
                email: document.getElementById('regEmail').value,
                name: document.getElementById('firstName').value + ' ' + document.getElementById('lastName').value
            };
            localStorage.setItem('watchly_temp_user', JSON.stringify(user));
            window.location.href = 'onboarding.html';
        });
    </script>
</body>
</html>
